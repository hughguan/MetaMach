# MetaMach 0.4.0 — CI Pipeline
# Native PG, no Docker. Tests janus-daemon, herdr-janus, janush, and janus::tmux.
# Per the 0.4.0 architecture: One PG, Multi-DB, tmux for session tests, SQLite bundled.

name: MetaMach CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Native PG connection (Unix socket via /tmp)
  PGHOST: /tmp
  PGUSER: metamach_admin
  PGDATABASE: metamach_db

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ["1.88"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metamach_admin
          POSTGRES_DB: metamach_db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux postgresql-client

      - name: Install Herdr (plugin host)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download latest Herdr Linux binary from GitHub releases
          HERDR_VERSION="0.7.5"
          curl -sSL "https://github.com/ogulcancelik/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-x86_64" -o /usr/local/bin/herdr
          chmod +x /usr/local/bin/herdr
          herdr --version
          # Start headless server (Homebrew-style service mode)
          mkdir -p /tmp/herdr-home/config /tmp/herdr-home/state
          export HOME=/tmp/herdr-home
          export XDG_CONFIG_HOME=/tmp/herdr-home/config
          export XDG_STATE_HOME=/tmp/herdr-home/state
          export HERDR_CONFIG_PATH=/tmp/herdr-home/config.toml
          export HERDR_SOCKET_PATH=/tmp/herdr-home/herdr.sock
          touch "$HERDR_CONFIG_PATH"
          herdr server &
          # Wait for socket to appear
          for i in $(seq 1 10); do
            [ -S "$HERDR_SOCKET_PATH" ] && break
            sleep 0.5
          done
          echo "HERDR_SOCKET_PATH=$HERDR_SOCKET_PATH" >> "$GITHUB_ENV"
          echo "HOME=/tmp/herdr-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=/tmp/herdr-home/config" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=/tmp/herdr-home/state" >> "$GITHUB_ENV"
          echo "HERDR_CONFIG_PATH=/tmp/herdr-home/config.toml" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Ensure rustfmt & clippy
        # dtolnay/rust-toolchain sometimes fails to install components
        # when a cached toolchain is restored. This is idempotent.
        run: |
          rustup component add rustfmt clippy 2>/dev/null || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            janus/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('janus/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Check formatting
        run: cargo fmt --all --manifest-path janus/Cargo.toml -- --check

      - name: Clippy (lint)
        run: cargo clippy --manifest-path janus/Cargo.toml --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked --manifest-path janus/Cargo.toml

      - name: Apply catalog migration
        # CI's postgres:16 service creates an empty metamach_db; apply the
        # catalog schema (blueprints + absurd_audit_log) that the PG-gated
        # onboard/offboard tests exercise. Locally `make db-init` does this.
        # Idempotent (CREATE TABLE/INDEX IF NOT EXISTS). The per-blueprint
        # 002/003 overlays are applied in-code by ensure_blueprint_db on onboard.
        run: psql "postgres://metamach_admin@localhost:5432/metamach_db" -v ON_ERROR_STOP=1 -f janus/migrations/001_catalog.sql

      - name: Run tests
        # PG-gated tests use runtime-skip (check DATABASE_URL) instead of
        # `#[ignore]` — they run automatically when PG is available (CI) and
        # skip gracefully when it's not (local dev without `make db-init`).
        run: cargo test --workspace --manifest-path janus/Cargo.toml
        env:
          DATABASE_URL: postgres://metamach_admin@localhost:5432/metamach_db
          TMUX_TMPDIR: /tmp
