# Agent role template: BUILDER
# Copy to .janus/agents/ and customize per project.

[agent.builder]
permissions   = ["read", "write", "edit", "bash-safe", "git-commit"]
bash_safe     = true
bash_blacklist = ["rm -rf /", "> /dev/sd*"]

# Uncomment and customize for your LLM provider:
